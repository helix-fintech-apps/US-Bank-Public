name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }
jobs:
  check:
    name: Lint, API and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The tests need Postgres. This matches the default in tests/helpers.mjs:
    # postgres://payroll@localhost:5433/usabanc_test, no password (trust auth, CI only).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payroll
          POSTGRES_DB: usabanc_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U payroll -d usabanc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://payroll@localhost:5433/usabanc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
        env: { SHOTS_DIR: shots }
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: screenshots, path: shots, if-no-files-found: ignore, retention-days: 14 }
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The gitleaks CLI directly: gitleaks-action needs a paid GITLEAKS_LICENSE on organization repos.
      - name: Install gitleaks
        env: { GITLEAKS_VERSION: 8.21.2 }
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
      - name: Scan the full history
        run: ./gitleaks git --redact --no-banner --verbose .
